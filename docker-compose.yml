version: '3.9'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: bazar
      POSTGRES_USER: bazar
      POSTGRES_PASSWORD: bazarpass
    volumes: [db-data:/var/lib/postgresql/data]
    ports: ['5432:5432']

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  meilisearch:
    image: getmeili/meilisearch:v1.7
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    ports: ['7700:7700']

  mailhog:
    image: mailhog/mailhog
    ports: ['1025:1025', '8025:8025']

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file: [.env]
    depends_on: [db, redis, meilisearch, mailhog]
    ports: ['4000:4000']
    volumes:
      - ./frontend/public/database:/app/data

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on: [server]
    ports: ['8080:80']

volumes:
  db-data:
