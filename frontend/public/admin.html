<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Administração - Bazar Bié Okutuala</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/design-system.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="./assets/css/components/header.css">
    <link rel="stylesheet" href="./assets/css/components/buttons.css">
    <link rel="stylesheet" href="./assets/css/admin.css">
</head>
<body>
    <!-- A navegação principal pode ser omitida ou diferente para o painel admin -->
    <header class="main-header" id="mainHeader"></header>

    <main class="admin-container">
        <aside class="admin-sidebar">
            <h2 class="admin-title">Admin</h2>
            <nav class="admin-nav">
                <a href="#dashboard" class="nav-item active"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <a href="#products" class="nav-item"><i class="fas fa-box"></i> Produtos</a>
                <a href="#users" class="nav-item"><i class="fas fa-users"></i> Usuários</a>
                <a href="#settings" class="nav-item"><i class="fas fa-cog"></i> Configurações</a>
            </nav>
        </aside>
        <section class="admin-content">
            <div id="dashboard" class="content-section active">
                <h3>Dashboard</h3>
                <p>Bem-vindo ao painel de administração.</p>
            </div>
            <div id="products" class="content-section">
                <h3>Gerenciar Produtos</h3>
            </div>
            <div id="users" class="content-section">
                <h3>Gerenciar Usuários</h3>
            </div>
            <div id="settings" class="content-section">
                <h3>Configurações Gerais</h3>
            </div>
        </section>
    </main>

    <nav class="bottom-nav" id="bottomNav"></nav>

    <script src="assets/js/geral.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="assets/js/admin.js"></script>
</body>
</html>
