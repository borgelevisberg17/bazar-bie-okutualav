<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Administração</title>
  <link rel="stylesheet" href="./assets/css/design-system.css">
  <link rel="stylesheet" href="./assets/css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <header class="main-header" id="mainHeader"></header>

    <main class="container admin-container">
        <h1>Painel de Administração</h1>
        <div class="admin-grid">
            <nav class="admin-nav">
                <a href="#dashboard-section" class="active"><i class="fas fa-home"></i> Dashboard</a>
                <a href="#users-section"><i class="fas fa-users"></i> Utilizadores</a>
                <a href="#products-section"><i class="fas fa-box"></i> Produtos</a>
                <a href="#sellers-section"><i class="fas fa-store"></i> Vendedores</a>
                <a href="#chat-section"><i class="fas fa-comments"></i> Chat</a>
            </nav>

            <div class="admin-content">
                <div id="dashboard-section" class="admin-section">
                    <h2>Dashboard</h2>
                    <div class="dashboard-cards">
                        <div class="card"><div class="card-body"><h5>Total de Utilizadores</h5><p id="total-users">0</p></div></div>
                        <div class="card"><div class="card-body"><h5>Produtos Pendentes</h5><p id="pending-products">0</p></div></div>
                        <div class="card"><div class="card-body"><h5>Vendedores Pendentes</h5><p id="pending-sellers">0</p></div></div>
                    </div>
                </div>
                <div id="users-section" class="admin-section" style="display: none;">
                    <h2>Utilizadores</h2>
                    <div class="table-responsive"><table class="table"><thead><tr><th>ID</th><th>Email</th><th>Nome</th><th>Role</th><th>Ações</th></tr></thead><tbody id="user-list"></tbody></table></div>
                </div>
                <div id="products-section" class="admin-section" style="display: none;">
                    <h2>Produtos Pendentes</h2>
                    <div class="table-responsive"><table class="table"><thead><tr><th>ID</th><th>Nome</th><th>Vendedor</th><th>Ações</th></tr></thead><tbody id="pending-products-list"></tbody></table></div>
                </div>
                <div id="sellers-section" class="admin-section" style="display: none;">
                    <h2>Vendedores Pendentes</h2>
                    <div class="table-responsive"><table class="table"><thead><tr><th>ID</th><th>Email</th><th>Ações</th></tr></thead><tbody id="seller-applications-list"></tbody></table></div>
                </div>
                <div id="chat-section" class="admin-section" style="display: none;">
                    <h2>Chat</h2>
                    <div class="form-group">
                        <label for="user-select">Select a user to chat with:</label>
                        <select class="form-control" id="user-select"></select>
                    </div>
                    <div class="chat-box" id="chatBox"></div>
                    <div class="input-group mt-3">
                        <input type="text" id="chatInput" class="form-control" placeholder="Type a message...">
                        <div class="input-group-append">
                            <button class="btn btn-primary" id="sendMessage">Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer" id="mainFooter"></footer>

    <!-- Modal de Edição -->
    <div class="modal" id="editUserModal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Editar Utilizador</h2>
            <form id="editUserForm">
                <input type="hidden" id="editUserId">
                <div class="form-group">
                    <label for="editUserRole">Role</label>
                    <select class="form-control" id="editUserRole">
                        <option value="user">user</option>
                        <option value="seller">seller</option>
                        <option value="admin">admin</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Salvar</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="assets/js/geral.js"></script>
    <script type="module" src="assets/js/admin.js"></script>
    <script src="assets/js/notifications.js"></script>
</body>
</html>
