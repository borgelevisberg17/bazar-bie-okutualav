<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Mídia Bazar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/admin-new.css">
</head>
<body class="theme-light">
    <div class="admin-panel">
        <aside class="sidebar">
            <!-- Sidebar content -->
        </aside>
        <div class="main-wrapper">
            <header class="topbar">
                <!-- Topbar content -->
            </header>
            <main class="main-content">
                <div id="dashboard" class="content-section active">...</div>
                <div id="users" class="content-section">...</div>
                <div id="products" class="content-section">...</div>
                <div id="statistics" class="content-section">
                    <div class="card">
                        <h2>Statistics</h2>
                        <div class="charts">
                            <div class="chart-container card">
                                <canvas id="sales-chart"></canvas>
                            </div>
                            <div class="chart-container card">
                                <canvas id="users-chart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="settings" class="content-section">
                    <div class="card">
                        <h2>Settings</h2>
                        <div class="form-group">
                            <label for="theme-select">Theme</label>
                            <select id="theme-select">
                                <option value="light">Light</option>
                                <option value="dark">Dark</option>
                            </select>
                        </div>
                    </div>
                </div>
                <!-- Other sections -->
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="../assets/js/admin-new.js"></script>
</body>
</html>
