<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore uma vasta gama de produtos no Bazar Bié Okutuala. Filtre por categoria, preço e mais para encontrar exatamente o que você procura." />
    <title>Categorias de Produtos - Bazar Bié Okutuala</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/design-system.css">
    <link rel="stylesheet" href="assets/css/categories.css">
</head>
<body>

    <header class="main-header" id="mainHeader"></header>

    <main class="container">
        <div class="page-header">
            <h1>Eletrônicos</h1>
            <p>Descubra os melhores gadgets e dispositivos para o seu dia a dia.</p>
        </div>

        <div class="shop-layout">
            <!-- Filters Sidebar -->
            <aside class="filters-sidebar">
                <h3>Filtros</h3>

                <div class="filter-group">
                    <h4>Preço</h4>
                    <input type="range" min="0" max="1000000" step="1000" class="price-range">
                    <div class="price-values">
                        <span>AOA 0</span>
                        <span>AOA 1,000,000+</span>
                    </div>
                </div>

                <div class="filter-group">
                    <h4>Marcas</h4>
                    <div class="filter-options">
                        <label><input type="checkbox" name="brand"> Marca A</label>
                        <label><input type="checkbox" name="brand"> Marca B</label>
                    </div>
                </div>

                <div class="filter-group">
                    <h4>Avaliações</h4>
                    <div class="filter-options">
                         <label><input type="radio" name="rating"> 4 estrelas ou mais</label>
                         <label><input type="radio" name="rating"> 3 estrelas ou mais</label>
                    </div>
                </div>

                <button class="btn btn-secondary">Limpar Filtros</button>
            </aside>

            <!-- Products Grid -->
            <section class="products-main">
                <div class="toolbar">
                    <span>Mostrando <strong>12</strong> de <strong>88</strong> resultados</span>
                    <select class="sort-select">
                        <option>Ordenar por: Mais vendidos</option>
                        <option>Ordenar por: Preço menor</option>
                        <option>Ordenar por: Melhor avaliado</option>
                    </select>
                </div>
                <div class="products-grid" id="products-grid">
                    <!-- Product cards will be dynamically inserted here -->
                </div>
                <div class="load-more-container">
                    <button id="load-more-btn" class="btn btn-primary">Carregar Mais</button>
                </div>
            </section>
        </div>
    </main>

    <footer class="main-footer"></footer>

    <script src="assets/js/geral.js"></script>
    <script src="assets/js/categorias.js"></script>
</body>
</html>
