<!doctype html>
<html lang="pt-AO">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Descubra o melhor do Bié. Moda, eletrônicos, artesanato e mais. Bié Okutuala é o seu mercado digital para encontrar produtos únicos e de qualidade."
        />
        <title>Bié Okutuala - O Seu Mercado Digital</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap"
            rel="stylesheet"
        />
        <script src="https://unpkg.com/lucide@latest"></script>
        <link
            href="https://unpkg.com/aos@2.3.1/dist/aos.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./assets/css/design-system.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
        <link rel="stylesheet" href="./assets/css/components/navbar.css" />
        <link rel="stylesheet" href="./assets/css/categorias.css" />
    </head>
    <body>
        <header class="main-header" id="mainHeader">
            <div class="container header-content">
                <a href="#" class="logo">Bié Okutuala</a>
                <nav class="desktop-nav">
                    <!-- Conteúdo do desktop nav aqui -->
                </nav>
                <button
                    class="mobile-menu-toggle"
                    id="menu-toggle"
                    aria-label="Abrir menu"
                >
                    <div class="hamburger-box">
                        <div class="hamburger-inner"></div>
                    </div>
                </button>
            </div>
        </header>

        <!-- Overlay para o fundo -->
        <div class="mobile-overlay" id="mobile-overlay"></div>
        
        <div class="hero-search">
            <form class="hero-searchbar" role="search">
                <label for="search-input" class="sr-only">Procurar por...</label>
                <input type="text" id="search-input" placeholder="Estou procurando por..." />
                <button class="btn-search" aria-label="Procurar">
                    <span class="search-icon">
                        <svg
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </span>
                </button>
            </div>
        </div>
        <main class="container">
            <section class="hero" data-aos="fade-in"></section>

            <section class="category-shelf" data-aos="fade-up">
                <div class="shelf-scroller" id="categoryShelf">
                    <!-- Categorias carregadas via JS -->
                </div>
            </section>

            <div class="shop">
                <div class="feed">
                    <header class="feed-header" data-aos="fade-up">
                        <h2 id="feedTitle">Para Si</h2>
                        <select id="sortSelect" class="sort-select">
                            <option value="relevance">Relevância</option>
                            <option value="price_asc">Preço: Menor</option>
                            <option value="price_desc">Preço: Maior</option>
                        </select>
                    </header>
                    <div class="grid" id="productsGrid"></div>
                    <div id="loader"></div>
                </div>
            </div>
        </main>

        <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
        <script src="assets/js/config.js"></script>
        <script src="assets/js/geral.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
        <script src="assets/js/notifications.js"></script>
        <script src="assets/js/categorias.js"></script>
    </body>
</html>
