<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias - Bazar Bié Okutuala</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/design-system.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="./assets/css/categorias.css">
</head>
<body>
    <header class="main-header" id="mainHeader"></header>

    <main class="container">
        <div class="category-page-layout">
            <aside class="filters-sidebar">
                <h2>Filtros</h2>
                <div class="filter-group">
                    <h3>Categorias</h3>
                    <ul id="category-filter-list"></ul>
                </div>
                <div class="filter-group">
                    <h3>Preço</h3>
                    <input type="range" id="price-range" min="0" max="100000" step="1000">
                    <span id="price-value">Kz 50000</span>
                </div>
            </aside>

            <section class="products-main">
                <div class="products-header">
                    <h1 id="category-title">Todos os Produtos</h1>
                    <select id="sort-select" class="sort-select">
                        <option value="relevance">Relevância</option>
                        <option value="price_asc">Preço: Menor</option>
                        <option value="price_desc">Preço: Maior</option>
                    </select>
                </div>
                <div class="products-grid" id="products-grid-category"></div>
                <div id="loader"></div>
            </section>
        </div>
    </main>

    <footer class="main-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="assets/js/services/api.js"></script>
    <script src="assets/js/notifications.js"></script>
    <script type="module" src="assets/js/categorias.js"></script>
</body>
</html>
