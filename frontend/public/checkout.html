<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Bazar Bié Okutuala</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/design-system.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="./assets/css/components/header.css">
    <link rel="stylesheet" href="./assets/css/components/footer.css">
    <link rel="stylesheet" href="./assets/css/components/buttons.css">
    <link rel="stylesheet" href="./assets/css/components/cards.css">
    <link rel="stylesheet" href="./assets/css/components/forms.css">
    <link rel="stylesheet" href="./assets/css/checkout.css"> <!-- Keep checkout specific styles -->
</head>
<body>
    <header class="main-header" id="mainHeader"></header>

    <main class="container checkout-container">
        <h1 class="checkout-title">Finalizar Compra</h1>
        <div class="checkout-grid">
            <div class="checkout-flow">
                <!-- Progress Bar remains the same -->
                <div class="checkout-progress">
                    <div class="progress-step active" data-step="1"><div class="step-circle">1</div><div class="step-label">Carrinho</div></div>
                    <div class="progress-line"></div>
                    <div class="progress-step" data-step="2"><div class="step-circle">2</div><div class="step-label">Entrega</div></div>
                    <div class="progress-line"></div>
                    <div class="progress-step" data-step="3"><div class="step-circle">3</div><div class="step-label">Pagamento</div></div>
                    <div class="progress-line"></div>
                    <div class="progress-step" data-step="4"><div class="step-circle">4</div><div class="step-label">Revisão</div></div>
                </div>

                <!-- Steps Content -->
                <div class="checkout-step-content active" data-step="1">
                    <div class="card"><h2 class="card-title">Seu Carrinho</h2><div id="cartItems" class="cart-items-list"></div></div>
                </div>
                <div class="checkout-step-content" data-step="2">
                    <div class="card"><h2 class="card-title">Detalhes da Entrega</h2><form id="deliveryForm" class="form-grid"></form></div>
                </div>
                <div class="checkout-step-content" data-step="3">
                    <div class="card"><h2 class="card-title">Método de Pagamento</h2><div class="payment-options"></div><div id="paymentDetails" class="payment-details-form"></div></div>
                </div>
                <div class="checkout-step-content" data-step="4">
                    <div class="card"><h2 class="card-title">Revisão do Pedido</h2><div class="review-details"></div></div>
                </div>
            </div>

            <aside class="order-summary">
                <div class="card">
                    <h2 class="card-title">Resumo do Pedido</h2>
                    <div class="summary-line-item"><span>Subtotal</span><span id="summarySubtotal">Kz 0,00</span></div>
                    <div class="summary-line-item"><span>Entrega</span><span id="summaryShipping">Kz 0,00</span></div>
                    <div class="summary-line-item discount"><span>Desconto</span><span id="summaryDiscount">- Kz 0,00</span></div>
                    <div class="summary-total"><span>Total</span><span id="summaryTotal">Kz 0,00</span></div>
                    <button id="checkout-next-btn" class="btn btn-primary btn-block">Continuar</button>
                    <button id="place-order-btn" class="btn btn-primary btn-block" style="display:none;">Finalizar Pedido</button>
                </div>
            </aside>
        </div>
    </main>

    <footer class="main-footer" id="mainFooter"></footer>

    <script src="assets/js/geral.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="assets/js/notifications.js"></script>
    <script src="./assets/js/checkout.js"></script>
</body>
</html>
