<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Complete sua compra de forma rápida e segura no Bazar Bié Okutuala." />
    <title>Checkout - Bazar Bié Okutuala</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/design-system.css">
    <link rel="stylesheet" href="assets/css/checkout.css">
</head>
<body>

    <header class="main-header" id="mainHeader"></header>

    <main class="container">
        <h1>Checkout</h1>
        <div class="checkout-layout">
            <!-- Checkout Form -->
            <section class="checkout-form">
                <div class="form-section">
                    <h2>Endereço de Entrega</h2>
                    <form id="shipping-form">
                        <div class="form-group">
                            <label for="full-name">Nome Completo</label>
                            <input type="text" id="full-name" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="address">Endereço</label>
                            <input type="text" id="address" class="form-control" required>
                        </div>
                    </form>
                </div>

                <div class="form-section">
                    <h2>Método de Pagamento</h2>
                    <form id="payment-form">
                        <!-- Payment options will be here -->
                    </form>
                </div>
            </section>

            <!-- Order Summary -->
            <aside class="order-summary">
                <h3>Resumo do Pedido</h3>
                <button class="btn btn-primary btn-block">Finalizar Compra</button>
            </aside>
        </div>
    </main>

    <footer class="main-footer"></footer>

    <script src="assets/js/geral.js"></script>
    <script src="assets/js/checkout.js"></script>
</body>
</html>
