<!-- Main Header -->
<header class="main-header">
    <div class="container header-container">
        <!-- Logo -->
        <div class="logo">
            <a href="/"
                ><img src="../assets/images/bazar-logo.png" /><span
                    >Bié okutuala</span
                ></a
            >
        </div>

        <!-- Desktop Search Bar -->
        <div class="header-search hide-on-mobile">
            <i class="fas fa-search search-icon"></i>
            <input type="text" placeholder="Procurar..." class="search-input" />
        </div>

        <!-- Header Actions (Desktop) -->
        <div class="header-actions hide-on-mobile">
            <!-- Authenticated User View -->
            <div
                id="auth-user-view"
                class="header-actions"
                style="display: none"
            >
                <a
                    href="/upload.html"
                    class="icon-btn"
                    aria-label="Upload Product"
                >
                    <i class="fas fa-plus-square"></i>
                </a>
                <a href="/messages.html" class="icon-btn" aria-label="Messages">
                    <i class="fas fa-paper-plane"></i>
                </a>
                <div class="profile-dropdown">
                    <img
                        src="/assets/images/placeholders/avatar.png"
                        alt="User Avatar"
                        id="profile-avatar"
                        class="profile-avatar"
                        tabindex="0"
                    />
                    <div class="dropdown-menu">
                        <a href="/profile.html"
                            ><i class="fas fa-user-circle"></i> Meu Perfil</a
                        >
                        <a href="/favorites.html"
                            ><i class="fas fa-heart"></i> Favoritos</a
                        >
                        <a href="/settings.html"
                            ><i class="fas fa-cog"></i> Configurações</a
                        >
                        <div class="dropdown-divider"></div>
                        <a href="#" id="logout-btn"
                            ><i class="fas fa-sign-out-alt"></i> Sair</a
                        >
                    </div>
                </div>
            </div>
            <!-- Guest User View -->
            <div id="guest-user-view" style="display: none">
                <a href="/auth/login.html" class="btn btn-outline">Entrar</a>
                <a href="/auth/register.html" class="btn btn-primary"
                    >Abrir Conta</a
                >
            </div>
        </div>

        <!-- Mobile Menu Toggle -->
        <div class="mobile-menu-toggle show-on-mobile">
            <button class="icon-btn" aria-label="favorite icon">
                <i class="far fa-heart"></i>
            </button>
            <button id="hamburger-btn" class="icon-btn" aria-label="Open Menu">
                <i class="fa fa-bars"></i>
            </button>
        </div>
    </div>
</header>

<!-- Mobile Sidebar -->
<aside class="mobile-sidebar" id="mobile-sidebar">
    <nav class="sidebar-nav">
        <!-- Authenticated User Links -->
        <div id="auth-sidebar-links" style="display: none">
            <a href="/profile.html"
                ><i class="fas fa-user-circle"></i> Meu Perfil</a
            >
            <a href="/upload.html"
                ><i class="fas fa-plus-square"></i> Vender Produto</a
            >
            <a href="/messages.html"
                ><i class="fas fa-paper-plane"></i> Mensagens</a
            >
            <a href="/favorites.html"><i class="fas fa-heart"></i> Favoritos</a>
            <a href="/settings.html"
                ><i class="fas fa-cog"></i> Configurações</a
            >
            <div class="dropdown-divider"></div>
            <a href="#" id="logout-btn-mobile"
                ><i class="fas fa-sign-out-alt"></i> Sair</a
            >
        </div>
        <!-- Guest User Links -->
        <div id="guest-sidebar-links" style="display: flex">
            <a href="/auth/login.html"
                ><i class="fas fa-sign-in-alt"></i> Entrar</a
            >
            <a href="/auth/register.html"
                ><i class="fas fa-user-plus"></i> Abrir Conta</a
            >
        </div>
    </nav>
</aside>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<!-- Mobile Bottom Navigation -->
<nav class="bottom-nav show-on-mobile">
    <a href="/" class="nav-item active" id="nav-home">
        <i class="fas fa-house"></i>
        
    </a>
    <a href="/explore.html" class="nav-item" id="nav-explore">
        <i class="fas fa-compass"></i>
        
    </a>
    <a
        href="/upload.html"
        class="nav-item nav-item-main auth-required upload-center"
        id="nav-upload"
    >
        <i class="fas fa-circle-plus"></i>

    </a>
    <a href="/messages.html" class="nav-item auth-required" id="nav-messages">
        <i class="fas fa-comments"></i>

    </a>
    <a href="/profile.html" class="nav-item auth-required" id="nav-profile">
        <i class="fas fa-circle-user"></i>
    </a>
</nav>
