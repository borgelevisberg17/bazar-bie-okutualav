<!doctype html>
<html lang="pt-AO">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Perfil de Utilizador - Bazar Bié Okutuala</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        />
        <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css" />
        <link rel="stylesheet" href="../assets/css/design-system.css" />
        <link rel="stylesheet" href="../assets/css/style.css" />
        <link rel="stylesheet" href="../assets/css/responsive.css" />
        <link rel="stylesheet" href="../assets/css/components/header.css" />
        <link rel="stylesheet" href="../assets/css/components/footer.css" />
        <link rel="stylesheet" href="../assets/css/components/cards.css" />
        <link rel="stylesheet" href="../assets/css/profile.css" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
        />
    </head>
    <body>
        <header id="header-placeholder"></header>

        <main class="container main-content">
            <section class="profile-header-container">
                <div class="profile-header">
                    <div class="profile-avatar-container">
                        <img
                            id="user-avatar"
                            src="../assets/images/placeholders/avatar.png"
                            alt="Avatar do Utilizador"
                            class="profile-avatar"
                        />
                    </div>
                    <div class="profile-info">
                        <h1 id="user-name" class="profile-name">
                            Nome do Utilizador
                        </h1>
                        <p id="user-bio" class="profile-bio">
                            Biografia do utilizador. Entusiasta de tecnologia e
                            vendedor de confiança no Bazar Bié.
                        </p>
                        <div class="profile-stats">
                            <div class="stat">
                                <span class="stat-number" id="products-count"
                                    >15</span
                                >
                                <span>Produtos</span>
                            </div>
                            <div class="stat">
                                <span class="stat-number" id="followers-count"
                                    >230</span
                                >
                                <span>Seguidores</span>
                            </div>
                            <div class="stat">
                                <span class="stat-number" id="following-count"
                                    >50</span
                                >
                                <span>A Seguir</span>
                            </div>
                        </div>
                        <div class="profile-actions">
                            <button class="btn btn-primary" id="follow-btn">
                                Seguir
                            </button>
                            <button class="btn btn-secondary" id="message-btn">
                                Mensagem
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <section class="user-products-container">
                <h2>
                    Produtos de
                    <span id="user-name-placeholder">Nome do Utilizador</span>
                </h2>
                <div class="product-grid" id="user-products-grid">
                    <!-- Product Card Placeholder -->
                    <div class="product-card">
                        <a
                            href="../product.html?id=1"
                            class="product-image-link"
                        >
                            <img
                                src="../assets/images/placeholders/product.png"
                                alt="Nome do Produto"
                                class="product-image"
                            />
                        </a>
                        <div class="product-info">
                            <a href="../product.html?id=1">
                                <h3 class="product-title">Produto Exemplo</h3>
                            </a>
                            <p class="product-price">AOA 15,000</p>
                        </div>
                    </div>
                    <!-- More products will be dynamically inserted here -->
                </div>
                <div
                    id="no-products-message"
                    class="empty-state"
                    style="display: none"
                >
                    <i class="fas fa-box-open"></i>
                    <h2>Este utilizador ainda não publicou produtos.</h2>
                    <p>Volte mais tarde para ver as novidades!</p>
                </div>
            </section>
        </main>

        <footer id="footer-placeholder"></footer>

        <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
        <script type="module" src="../assets/js/geral.js"></script>
        <script type="module" src="../assets/js/services/api.js"></script>
        <script type="module" src="../assets/js/notifications.js"></script>
        <script type="module" src="../assets/js/details/user.js"></script>
        <script type="module" src="../assets/js/theme.js"></script>
    </body>
</html>
