<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Produtos - Bazar Bié Okutuala</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="./assets/css/design-system.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/responsive.css">
    <link rel="stylesheet" href="./assets/css/components/header.css">
    <link rel="stylesheet" href="./assets/css/components/footer.css">
    <link rel="stylesheet" href="./assets/css/components/cards.css">
    <link rel="stylesheet" href="./assets/css/explore-new.css">
    <link rel="stylesheet" href="./assets/css/categories.css">
    <link rel="stylesheet" href="./assets/css/loading.css">
</head>
<body>
    <header id="header-placeholder"></header>

    <main class="container main-content">
        <div class="explore-layout">
            <!-- Filters Sidebar -->
            <aside class="filters-sidebar">
                <h3>Filtros</h3>
                <div class="filter-group">
                    <h4>Categorias</h4>
                    <div id="category-filters">
                        <!-- Category filters will be dynamically loaded here -->
                    </div>
                </div>
                <div class="filter-group">
                    <h4>Preço</h4>
                    <div class="price-range-slider">
                        <input type="range" id="price-range" min="0" max="100000" value="100000">
                        <span id="price-value">Kz 100,000</span>
                    </div>
                </div>
                <button class="btn btn-primary btn-block">Aplicar Filtros</button>
            </aside>

            <!-- Products Grid -->
            <section class="products-section">
                <div class="toolbar">
                    <button id="filter-toggle-btn" class="icon-btn show-on-mobile"><i class="fas fa-filter"></i></button>
                    <div class="sort-options">
                        <label for="sort-by">Ordenar por:</label>
                        <select id="sort-by">
                            <option value="latest">Mais Recentes</option>
                            <option value="price-asc">Preço: Baixo para Alto</option>
                            <option value="price-desc">Preço: Alto para Baixo</option>
                        </select>
                    </div>
                </div>
                <div class="products-grid" id="products-grid-explore">
                    <!-- Product cards will be dynamically inserted here -->
                </div>
                <div id="loading-animation" class="loading-animation" style="display: none;">
                    <div class="spinner"></div>
                </div>
            </section>
        </div>
    </main>

    <footer id="footer-placeholder"></footer>

    <script type="module" src="assets/js/geral.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="assets/js/services/api.js"></script>
    <script type="module" src="assets/js/notifications.js"></script>
    <script type="module" src="assets/js/explore.js"></script>
    <script type="module" src="assets/js/theme.js"></script>
</body>
</html>
