<!doctype html>
<html lang="pt-AO">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bazar Bié Okutuala - O Seu Feed de Compras</title>
        <!-- Font Awesome for icons -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
            integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />

        <!-- Global Stylesheets -->
        <link rel="stylesheet" href="./assets/css/design-system.css" />
        <link rel="stylesheet" href="./assets/css/style.css" />
        <link rel="stylesheet" href="./assets/css/responsive.css" />

        <!-- Component Stylesheets -->
        <link rel="stylesheet" href="./assets/css/components/header.css" />
        <link rel="stylesheet" href="./assets/css/components/cards.css" />
        <link rel="stylesheet" href="./assets/css/components/footer.css" />
        <link rel="stylesheet" href="./assets/css/components/quick-view.css" />

        <!-- Page-Specific Stylesheet -->
        <link rel="stylesheet" href="./assets/css/main.css" />

        <!-- Toastify for notifications -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
        />
    </head>
    <body>
        <!-- Header Placeholder -->
        <header id="header-placeholder"></header>

        <!-- Main Content -->
        <main class="container main-content">
            <!-- Social Feed Container -->
            <section class="social-feed" id="social-feed">
                <!-- Product posts will be dynamically inserted here -->
            </section>
        </main>

        <!-- Footer Placeholder -->
        <footer id="footer-placeholder"></footer>

        <!-- Quick View Modal -->
        <div class="modal-overlay" id="quick-view-modal">
            <div class="modal-content">
                <button class="modal-close-btn" id="modal-close-btn">
                    <i class="fas fa-times"></i>
                </button>
                <div id="quick-view-content"></div>
            </div>
        </div>

        <!-- JavaScript -->
        <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
        <script type="module" src="assets/js/auth.js"></script>
        <script type="module" src="assets/js/geral.js"></script>
        <script type="module" src="assets/js/services/api.js"></script>
        <script type="module" src="assets/js/notifications.js"></script>
        <script type="module" src="assets/js/main.js"></script>
        <script type="module" src="assets/js/theme.js"></script>
