<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Produto - Bazar Bié Okutuala</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/design-system.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="./assets/css/components/navbar.css">
    <link rel="stylesheet" href="./assets/css/product-details.css">
</head>
<body>
    <header class="main-header" id="mainHeader">
        <!-- O mesmo header de antes -->
    </header>

    <main class="container product-details-container">
        <div class="product-details-layout">
            <section class="product-gallery">
                <div class="main-image">
                    <img src="assets/images/placeholders/product-main.png" alt="Produto Principal" id="main-product-image">
                </div>
                <div class="thumbnail-images" id="thumbnail-gallery">
                    <!-- Thumbnails serão inseridos dinamicamente -->
                </div>
            </section>

            <section class="product-info-details">
                <div class="seller-profile-header">
                    <img src="assets/images/placeholders/avatar.png" class="seller-avatar-large" alt="Vendedor" id="seller-avatar">
                    <div class="seller-details">
                        <a href="#" class="seller-name-details" id="seller-name">Nome do Vendedor</a>
                        <p class="seller-location" id="seller-location">Bié, Angola</p>
                    </div>
                </div>

                <h1 class="product-title-details" id="product-name">Nome do Produto</h1>
                <p class="product-price-details" id="product-price">Kz 0,00</p>
                <p class="product-description-details" id="product-description"></p>

                <div class="product-actions-group">
                    <div class="quantity-selector">
                        <button class="btn-quantity" data-action="decrease">-</button>
                        <input type="number" class="quantity-input" value="1" min="1" id="quantity-input">
                        <button class="btn-quantity" data-action="increase">+</button>
                    </div>
                    <button class="btn btn-primary btn-add-to-cart-details" id="add-to-cart-btn">Adicionar ao Carrinho</button>
                </div>

                <div class="product-secondary-actions">
                    <button class="btn-action" id="wishlist-btn"><i class="far fa-heart"></i> Adicionar aos Favoritos</button>
                    <button class="btn-action"><i class="fas fa-share-alt"></i> Partilhar</button>
                </div>
            </section>
        </div>

        <section class="comments-section">
            <h2>Comentários</h2>
            <form class="comment-form" id="comment-form">
                <input type="text" class="comment-input" placeholder="Adicione um comentário..." required>
                <button type="submit" class="btn btn-primary">Publicar</button>
            </form>
            <div class="comment-list" id="comments-list">
                <!-- Comentários serão inseridos dinamicamente -->
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <!-- O mesmo footer de antes -->
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="assets/js/services/api.js"></script>
    <script src="assets/js/notifications.js"></script>
    <script type="module" src="assets/js/product-details.js"></script>
    <script type="module" src="assets/js/theme.js"></script>
</body>
</html>
