<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Produto - Bazar Bié Okutuala</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/design-system.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="./assets/css/components/header.css">
    <link rel="stylesheet" href="./assets/css/components/buttons.css">
    <link rel="stylesheet" href="./assets/css/product-details.css">
    <link rel="stylesheet" href="./assets/css/components/footer.css">
</head>
<body>
    <header class="main-header" id="mainHeader"></header>

    <main class="container product-detail-page">
        <!-- Main Product Post -->
        <div class="product-post-card-expanded">
            <div class="post-image-expanded">
                <img src="assets/images/placeholders/product-main.png" alt="Produto Principal" id="main-product-image">
            </div>
            <div class="post-content-expanded">
                <div class="post-header-expanded">
                    <img src="assets/images/placeholders/avatar.png" class="seller-avatar" alt="Vendedor" id="seller-avatar">
                    <div class="seller-info">
                        <a href="#" class="seller-name" id="seller-name">Nome do Vendedor</a>
                        <p class="seller-location" id="seller-location">Bié, Angola</p>
                    </div>
                    <button class="btn btn-secondary btn-follow">Seguir</button>
                </div>
                <div class="post-body-expanded">
                    <h1 class="product-title-details" id="product-name">Nome do Produto</h1>
                    <p class="product-price-details" id="product-price">Kz 0,00</p>
                    <p class="product-description-details" id="product-description"></p>
                </div>
                <div class="post-actions-expanded">
                    <button class="btn btn-primary btn-block">Adicionar ao Carrinho</button>
                    <button class="btn btn-ghost btn-block" id="like-btn"><i class="far fa-heart"></i> Gostar</button>
                </div>
            </div>
        </div>

        <!-- Comments Section -->
        <section class="comments-section" id="comments">
            <h2>Comentários</h2>
            <form class="comment-form" id="comment-form">
                <img src="assets/images/placeholders/avatar.png" class="current-user-avatar" alt="Seu Avatar">
                <input type="text" class="comment-input" placeholder="Adicione um comentário..." required>
                <button type="submit" class="btn btn-primary">Publicar</button>
            </form>
            <div class="comment-list" id="comments-list">
                <!-- Comments will be dynamically inserted here -->
            </div>
        </section>
    </main>

    <nav class="bottom-nav" id="bottomNav"></nav>

    <script src="assets/js/geral.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="assets/js/services/api.js"></script>
    <script src="assets/js/notifications.js"></script>
    <script type="module" src="assets/js/product-details.js"></script>

    <footer id="mainFooter"></footer>
</body>
</html>
