<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Produto - Bazar Bié Okutuala</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/design-system.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="./assets/css/product-details.css">
</head>
<body>
    <header class="main-header" id="mainHeader"></header>

    <main class="container">
        <div class="product-details-layout">
            <section class="product-gallery">
                <div class="main-image">
                    <img src="" alt="Produto Principal" id="main-product-image">
                </div>
                <div class="thumbnail-images"></div>
            </section>

            <section class="product-info-details">
                <h1 class="product-title-details">Nome do Produto</h1>
                <div class="product-rating-details"></div>
                <p class="product-price-details">Kz 0,00</p>
                <p class="product-description-details"></p>

                <div class="product-actions">
                    <div class="quantity-selector">
                        <button class="btn-quantity" data-action="decrease">-</button>
                        <input type="number" class="quantity-input" value="1" min="1">
                        <button class="btn-quantity" data-action="increase">+</button>
                    </div>
                    <button class="btn btn-primary btn-add-to-cart">Adicionar ao Carrinho</button>
                </div>
                <button class="btn-wishlist-details"><i class="far fa-heart"></i> Adicionar aos Favoritos</button>
                <div class="social-share">
                    <span>Partilhar:</span>
                    <a href="#" class="social-icon"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-twitter"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-whatsapp"></i></a>
                </div>
            </section>
        </div>

        <section class="product-reviews">
            <h2>Avaliações de Clientes</h2>
            <div class="reviews-summary"></div>
            <div class="reviews-list"></div>
        </section>
    </main>

    <footer class="main-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="assets/js/services/api.js"></script>
    <script src="assets/js/notifications.js"></script>
    <script type="module" src="assets/js/product-details.js"></script>
</body>
</html>
