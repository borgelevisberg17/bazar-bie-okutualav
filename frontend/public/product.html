<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Produto - Bazar Bié Okutuala</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
     <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />

    <!-- Global Stylesheets -->
    <link rel="stylesheet" href="./assets/css/design-system.css">
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="stylesheet" href="./assets/css/responsive.css" />

    <!-- Component Stylesheets -->
    <link rel="stylesheet" href="./assets/css/components/header.css">
    <link rel="stylesheet" href="./assets/css/components/footer.css">

    <!-- Page-Specific Stylesheet -->
    <link rel="stylesheet" href="./assets/css/product-details-new.css">

    <!-- Toastify for notifications -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <!-- Header Placeholder -->
    <header id="header-placeholder"></header>

    <main class="container main-content" id="product-details-page">
        <div v-if="isLoading" class="loading-spinner">Carregando detalhes do produto...</div>
        <div v-else-if="error" class="error-message">{{ error }}</div>

        <template v-else-if="product">
            <div class="product-details-container">
                <!-- Image Gallery -->
                <section class="product-gallery">
                    <div class="main-image-container">
                        <img :src="mainImage" alt="Produto Principal" id="main-product-image">
                    </div>
                    <div class="thumbnail-gallery" id="thumbnail-gallery">
                        <div class="thumbnail-item" v-for="image in product.images" :key="image.id" @click="changeImage(image.image_url)">
                            <img :src="image.image_url" alt="Thumbnail">
                        </div>
                    </div>
                </section>

                <!-- Product Info -->
                <section class="product-info">
                    <div class="product-header">
                        <span class="product-category">{{ product.category?.name || "Sem Categoria" }}</span>
                        <h1 class="product-title">{{ product.name }}</h1>
                        <p class="product-price">{{ formattedPrice }}</p>
                    </div>

                    <div class="product-description">
                        <p>{{ product.description }}</p>
                    </div>

                    <div class="product-actions">
                        <button class="btn btn-primary btn-block" @click="openWhatsApp">
                            <i class="fab fa-whatsapp"></i> Comprar no WhatsApp
                        </button>
                    </div>

                    <div class="social-actions">
                         <button class="btn social-btn" @click="handleLikeToggle" :data-liked="product.is_liked">
                            <i :class="product.is_liked ? 'fas' : 'far'" class="fa-heart"></i>
                            <span>{{ product.likes_count }} Gostos</span>
                        </button>
                        <button class="btn social-btn">
                           <i class="far fa-comment"></i>
                           <span>{{ product.comments_count }} Comentários</span>
                       </button>
                    </div>
                </section>

                <!-- Seller Card -->
                <aside class="seller-card-container">
                     <div class="seller-card">
                        <a :href="'seller.html?id=' + product.seller.id" class="seller-link">
                            <img :src="product.seller.avatar_url || 'assets/images/placeholders/avatar.png'" class="seller-avatar" alt="Vendedor">
                            <div class="seller-details">
                               <span class="seller-name">{{ product.seller.name }}</span>
                               <span class="seller-rating">Vendedor Verificado</span>
                            </div>
                        </a>
                        <button class="btn btn-outline">Seguir</button>
                    </div>
                </aside>
            </div>

            <!-- Comments Section -->
            <section id="comments-section" class="comments-section">
                <h2>Comentários</h2>
                <div class="comment-form-container" v-if="currentUser">
                    <textarea v-model="newCommentText" placeholder="Adicione um comentário..."></textarea>
                    <button @click="handleAddComment" class="btn btn-primary">Publicar</button>
                </div>
                 <p v-else>Você precisa <a href="/auth/login.html">iniciar sessão</a> para comentar.</p>
                <div id="comments-list" class="comments-list">
                    <div v-for="comment in product.comments" :key="comment.id" class="comment-item">
                        <img :src="comment.user.avatar_url || 'assets/images/placeholders/avatar.png'" :alt="comment.user.name" class="comment-avatar">
                        <div class="comment-content">
                            <span class="comment-author">{{ comment.user.name }}</span>
                            <p class="comment-text">{{ comment.comment }}</p>
                        </div>
                    </div>
                </div>
            </section>
        </template>
    </main>

    <!-- Footer Placeholder -->
    <footer id="footer-placeholder"></footer>

    <!-- JavaScript -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="assets/js/geral.js"></script>
    <script type="module" src="assets/js/services/api.js"></script>
    <script type="module" src="assets/js/notifications.js"></script>
    <script type="module" src="assets/js/product-details.js"></script>
    <script type="module" src="assets/js/theme.js"></script>
</body>
</html>
