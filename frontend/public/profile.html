<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gerencie sua conta, veja seu histórico de pedidos e atualize suas informações no Bazar Bié Okutuala." />
    <title>Meu Perfil - Bazar Bié Okutuala</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/design-system.css">
    <link rel="stylesheet" href="assets/css/profile.css">
</head>
<body>

    <header class="main-header" id="mainHeader"></header>

    <main class="container">
        <div class="profile-layout">
            <!-- Sidebar Navigation -->
            <aside class="profile-sidebar">
                <div class="user-card">
                    <img src="https://via.placeholder.com/100" alt="Avatar do usuário" id="user-avatar">
                    <h3 id="user-name">Nome do Usuário</h3>
                </div>
                <nav class="profile-nav">
                    <a href="#dashboard" class="nav-link active"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                    <a href="#orders" class="nav-link"><i class="fas fa-box"></i> Meus Pedidos</a>
                    <a href="#favorites" class="nav-link"><i class="fas fa-heart"></i> Favoritos</a>
                    <a href="#account" class="nav-link"><i class="fas fa-user-cog"></i> Detalhes da Conta</a>
                    <a href="#" class="nav-link" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Sair</a>
                </nav>
            </aside>

            <!-- Content Area -->
            <section class="profile-content">
                <!-- Each section below is a "tab" that will be shown/hidden -->
                <div id="dashboard" class="content-section active">
                    <h2>Dashboard</h2>
                    <p>Bem-vindo(a) de volta! Aqui você pode ver um resumo da sua atividade recente.</p>
                </div>

                <div id="orders" class="content-section">
                    <h2>Meus Pedidos</h2>
                    <div class="order-list">
                        <!-- Example Order Item -->
                        <div class="order-item">
                            <p>Pedido #12345</p>
                            <p>Status: Entregue</p>
                            <a href="#" class="btn btn-secondary">Ver Detalhes</a>
                        </div>
                    </div>
                </div>

                <div id="favorites" class="content-section">
                    <h2>Meus Favoritos</h2>
                    <div class="products-grid" id="favorites-grid">
                        <!-- Favorite product cards will be inserted here -->
                    </div>
                </div>

                <div id="account" class="content-section">
                    <h2>Detalhes da Conta</h2>
                    <form id="account-details-form">
                        <div class="form-group">
                            <label for="full-name">Nome Completo</label>
                            <input type="text" id="full-name" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="email">Endereço de E-mail</label>
                            <input type="email" id="email" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <footer class="main-footer"></footer>

    <script src="assets/js/geral.js"></script>
    <script src="assets/js/user.js"></script>
</body>
</html>
