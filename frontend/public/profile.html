<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 ">
    <title>Meu Perfil - Bié Okutuala</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/user.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.441.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.min.js"></script>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="container">
            <a href="index.html" class="logo">Bié Okutuala</a>
            <div id="userActions" class="user-actions"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="user-profile">
        <div class="container">
            <!-- Sidebar -->
            <nav class="sidebar">
                <div class="user-info">
                    <img id="userAvatar" src="" alt="Avatar do Usuário" class="user-avatar">
                    <h2 id="userName"></h2>
                    <p id="userLocation"></p>
                    <div class="user-rating">
                        <div class="stars" id="userStars"></div>
                        <span id="userReviews"></span>
                    </div>
                    <button class="btn btn-secondary btn-edit-profile" id="editProfileBtn">Editar Perfil</button>
                </div>
                <ul class="sidebar-menu">
                    <li><button class="sidebar-btn active" data-section="orders">Meus Pedidos</button></li>
                    <li><button class="sidebar-btn" data-section="wishlist">Lista de Desejos</button></li>
                    <li><button class="sidebar-btn" data-section="listings">Meus Anúncios</button></li>
                    <li><button class="sidebar-btn" data-section="messages">Mensagens</button></li>
                    <li><button class="sidebar-btn" data-section="settings">Configurações</button></li>
                    <li><button class="sidebar-btn btn-logout" id="logoutBtn">Sair</button></li>
                </ul>
            </nav>

            <!-- Content Area -->
            <section class="content-area">
                <!-- Orders -->
                <div class="section active" id="orders">
                    <h2>Meus Pedidos</h2>
                    <div id="ordersList"></div>
                </div>

                <!-- Wishlist -->
                <div class="section" id="wishlist">
                    <h2>Lista de Desejos</h2>
                    <div class="products-grid" id="wishlistItems"></div>
                </div>

                <!-- Listings -->
                <div class="section" id="listings">
                    <h2>Meus Anúncios</h2>
                    <button class="btn btn-primary btn-new-listing" id="newListingBtn">Novo Anúncio</button>
                    <div class="products-grid" id="listingsItems"></div>
                </div>

                <!-- Messages -->
                <div class="section" id="messages">
                    <h2>Mensagens</h2>
                    <div id="messagesList"></div>
                </div>

                <!-- Settings -->
                <div class="section" id="settings">
                    <h2>Configurações</h2>
                    <div class="settings-form">
                        <h3>Preferências</h3>
                        <label><input type="checkbox" id="themeToggle"> Tema Escuro</label>
                        <label><input type="checkbox" id="voiceToggle"> Ativar Voz</label>
                        <label><input type="checkbox" id="notificationsToggle"> Notificações</label>
                        <h3>Endereço de Entrega</h3>
                        <input type="text" id="deliveryAddress" placeholder="Ex.: Rua do Kuzola, Luanda">
                        <button class="btn btn-primary btn-save-settings" id="saveSettingsBtn">Salvar</button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Edit Profile Modal -->
    <div id="editProfileModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="modal-close">×</span>
            <h3>Editar Perfil</h3>
            <form id="editProfileForm">
                <label for="profileAvatar">Foto de Perfil</label>
                <input type="file" id="profileAvatar" accept="image/*">
                <label for="profileName">Nome</label>
                <input type="text" id="profileName" required>
                <label for="profileLocation">Localização</label>
                <input type="text" id="profileLocation">
                <label for="profilePassword">Nova Senha</label>
                <input type="password" id="profilePassword">
                <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            </form>
        </div>
    </div>

    <!-- New Listing Modal -->
    <div id="newListingModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="modal-close">×</span>
            <h3>Novo Anúncio</h3>
            <form id="newListingForm">
                <label for="listingName">Nome do Produto</label>
                <input type="text" id="listingName" required>
                <label for="listingPrice">Preço (Kz)</label>
                <input type="number" id="listingPrice" required>
                <label for="listingCategory">Categoria</label>
                <select id="listingCategory" required>
                    <option value="Eletrônicos">Eletrônicos</option>
                    <option value="Moda">Moda</option>
                    <option value="Móveis">Móveis</option>
                    <option value="Veículos">Veículos</option>
                </select>
                <label for="listingImages">Imagens</label>
                <input type="file" id="listingImages" accept="image/*" multiple>
                <label for="listingDescription">Descrição</label>
                <textarea id="listingDescription" required></textarea>
                <button type="submit" class="btn btn-primary">Publicar Anúncio</button>
            </form>
        </div>
    </div>

    <!-- Message Modal -->
    <div id="messageModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="modal-close">×</span>
            <h3>Conversa</h3>
            <div id="messageContent"></div>
            <form id="sendMessageForm">
                <textarea id="messageText" placeholder="Escreva sua mensagem..." required></textarea>
                <button type="submit" class="btn btn-primary">Enviar</button>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toastNotification" class="toast"></div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/user.js"></script>
</body>
</html>
