<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Bazar Bié Okutuala</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/design-system.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="./assets/css/components/navbar.css" />
    <link rel="stylesheet" href="./assets/css/profile.css">
</head>
<body>
    <header class="main-header" id="mainHeader"></header>

    <main class="profile-page-container">
        <section class="profile-header-section">
            <div class="profile-cover-photo">
                <img src="assets/images/placeholders/cover-photo.png" alt="Foto de Capa">
            </div>
            <div class="profile-details-container container">
                <div class="profile-avatar-container">
                    <img src="assets/images/placeholders/user-avatar.png" alt="Avatar do Usuário" class="profile-avatar">
                </div>
                <div class="profile-info">
                    <h1 class="profile-name">Nome do Usuário</h1>
                    <p class="profile-bio">Breve biografia ou localização do usuário.</p>
                </div>
                <div class="profile-header-actions">
                    <button class="btn btn-secondary">Editar Perfil</button>
                </div>
            </div>
            <nav class="profile-tabs-nav container">
                <a href="#products" class="tab-link active">Meus Produtos</a>
                <a href="#favorites" class="tab-link">Favoritos</a>
                <a href="#settings" class="tab-link">Configurações</a>
            </nav>
        </section>

        <div class="profile-content-container container">
            <div id="products" class="tab-content active">
                <div class="products-grid" id="user-products-grid">
                    <!-- User's products will be dynamically inserted here -->
                </div>
            </div>
            <div id="favorites" class="tab-content">
                <div class="products-grid" id="user-favorites-grid">
                    <!-- User's favorite products will be dynamically inserted here -->
                </div>
            </div>
            <div id="settings" class="tab-content">
                <!-- User settings form will be here -->
            </div>
        </div>
    </main>

    <footer class="main-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="assets/js/services/api.js"></script>
    <script src="assets/js/notifications.js"></script>
    <script type="module" src="assets/js/profile.js"></script>
</body>
</html>
