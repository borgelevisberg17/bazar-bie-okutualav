<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segurança da Conta - Bazar Bié Okutuala</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
     <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="./assets/css/design-system.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="./assets/css/components/header.css">
    <link rel="stylesheet" href="./assets/css/components/footer.css">
    <link rel="stylesheet" href="./assets/css/components/buttons.css">
    <link rel="stylesheet" href="./assets/css/components/forms.css">
    <link rel="stylesheet" href="./assets/css/security.css">
</head>
<body>
    <header class="main-header" id="mainHeader"></header>

    <main class="container security-container">
        <h1>Segurança da Conta</h1>
        <div class="card">
            <h2 class="card-title">Alterar Senha</h2>
            <form id="changePasswordForm" class="form-grid">
                <div class="form-group span-2">
                    <label for="currentPassword" class="form-label">Senha Atual</label>
                    <input type="password" id="currentPassword" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="newPassword" class="form-label">Nova Senha</label>
                    <input type="password" id="newPassword" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirmar Nova Senha</label>
                    <input type="password" id="confirmPassword" class="form-control" required>
                </div>
                <div class="form-group span-2 form-actions">
                    <button type="submit" class="btn btn-primary">Alterar Senha</button>
                </div>
            </form>
        </div>

        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Autenticação de Dois Fatores (2FA)</h2>
            </div>
            <p class="card-subtitle">Adicione uma camada extra de segurança à sua conta.</p>
            <div id="2fa-enabled" style="display: none;">
                 <button class="btn btn-danger" id="disable-2fa-btn">Desativar 2FA</button>
            </div>
            <div id="2fa-disabled">
                <button class="btn btn-primary" id="setup-2fa-btn">Ativar 2FA</button>
                <div id="qr-code-container" style="display: none; margin-top: 1.5rem;">
                    <p>1. Escaneie este QR Code com seu aplicativo de autenticação:</p>
                    <img id="qr-code" src="" alt="QR Code para 2FA" class="qr-code-image">
                    <p>2. Digite o código de 6 dígitos gerado pelo aplicativo:</p>
                    <div class="otp-input-group">
                        <input type="text" id="otp-input" class="form-control" placeholder="123456">
                        <button id="verify-2fa-btn" class="btn btn-primary">Verificar e Ativar</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer" id="mainFooter"></footer>

    <script type="module" src="assets/js/geral.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="assets/js/notifications.js"></script>
    <script type="module" src="assets/js/security.js"></script>
</body>
</html>
