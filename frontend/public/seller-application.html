<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição de Vendedor - Bazar Bié Okutuala</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
     <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="./assets/css/design-system.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="./assets/css/components/header.css">
    <link rel="stylesheet" href="./assets/css/components/footer.css">
    <link rel="stylesheet" href="./assets/css/components/buttons.css">
    <link rel="stylesheet" href="./assets/css/components/forms.css">
    <link rel="stylesheet" href="./assets/css/seller-application.css">
</head>
<body>
    <header class="main-header" id="mainHeader"></header>

    <main class="application-container container">
        <div class="application-header">
            <h1 class="application-title">Inscrição de Vendedor</h1>
            <p class="application-subtitle">Junte-se à nossa comunidade. Preencha os seus dados para começar.</p>
        </div>

        <div class="application-form-container">
            <div class="card">
                <form id="seller-application-form" class="form-grid">
                    <div class="form-section">
                        <h2 class="form-section-title">1. Informações Pessoais</h2>
                        <div class="form-group"><label for="fullName" class="form-label">Nome Completo</label><input type="text" id="fullName" class="form-control" required></div>
                        <div class="form-group"><label for="email" class="form-label">Email</label><input type="email" id="email" class="form-control" required></div>
                        <div class="form-group"><label for="phone" class="form-label">Telefone</label><input type="tel" id="phone" class="form-control" required></div>
                        <div class="form-group"><label for="nif" class="form-label">NIF</label><input type="text" id="nif" class="form-control" required></div>
                    </div>

                    <div class="form-section">
                        <h2 class="form-section-title">2. Detalhes da Loja</h2>
                        <div class="form-group"><label for="storeName" class="form-label">Nome da Loja</label><input type="text" id="storeName" class="form-control" required></div>
                        <div class="form-group span-2"><label for="storeDescription" class="form-label">Descrição da Loja</label><textarea id="storeDescription" class="form-control" rows="3"></textarea></div>
                    </div>

                    <div class="form-section">
                         <h2 class="form-section-title">3. Pagamento da Taxa de Inscrição</h2>
                         <p class="payment-info">Para ativar sua loja, é necessário o pagamento de uma taxa única de <strong>5,000 Kz</strong>.</p>
                         <div class="form-group">
                            <label for="cardNumber" class="form-label">Número do Cartão</label>
                            <input type="text" id="cardNumber" class="form-control" placeholder="**** **** **** ****" required>
                        </div>
                        <div class="form-group">
                            <label for="expiryDate" class="form-label">Data de Validade</label>
                            <input type="text" id="expiryDate" class="form-control" placeholder="MM/AA" required>
                        </div>
                         <div class="form-group">
                            <label for="cvv" class="form-label">CVV</label>
                            <input type="text" id="cvv" class="form-control" placeholder="123" required>
                        </div>
                    </div>

                    <div class="form-group span-2 terms-group">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">Li e concordo com os <a href="#">Termos e Condições para Vendedores</a>.</label>
                    </div>

                    <div class="form-group span-2 form-actions">
                        <button type="submit" class="btn btn-primary btn-lg">Pagar e Enviar Inscrição</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

        <footer id="footer-placeholder"></footer>

    <script type="module" src="assets/js/geral.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="assets/js/notifications.js"></script>
    <script type="module" src="assets/js/seller-application.js"></script>
</body>
</html>
