<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Vendedor - Bazar Bié Okutuala</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
     <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="./assets/css/design-system.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="./assets/css/components/header.css">
    <link rel="stylesheet" href="./assets/css/components/footer.css">
    <link rel="stylesheet" href="./assets/css/components/buttons.css">
    <link rel="stylesheet" href="./assets/css/components/cards.css">
    <link rel="stylesheet" href="./assets/css/profile.css">
</head>
<body>
    <header class="main-header" id="mainHeader"></header>

    <main class="profile-page">
        <!-- Seller Banner -->
        <section class="profile-banner">
            <img src="assets/images/placeholders/seller-cover.png" alt="Banner do Vendedor" id="seller-banner">
        </section>

        <!-- Seller Header -->
        <section class="container profile-header">
            <div class="profile-avatar">
                <img src="assets/images/placeholders/seller-avatar.png" alt="Avatar do Vendedor" id="seller-avatar">
            </div>
            <div class="profile-info">
                <h1 class="seller-name" id="seller-name">Nome do Vendedor</h1>
                <p class="seller-bio" id="seller-bio">Biografia do vendedor...</p>
                <div class="seller-stats">
                    <span><strong id="product-count">0</strong> Produtos</span>
                    <span><strong id="follower-count">0</strong> Seguidores</span>
                    <span><strong id="seller-rating">4.5</strong> <i class="fas fa-star"></i></span>
                </div>
            </div>
            <div class="profile-actions">
                <button class="btn btn-primary" id="follow-btn"><i class="fas fa-user-plus"></i> Seguir</button>
                <button class="btn btn-outline" id="message-btn"><i class="fas fa-envelope"></i> Mensagem</button>
            </div>
        </section>

        <!-- Seller's Products -->
        <section class="container seller-products">
            <h2>Produtos</h2>
            <div class="products-grid" id="seller-products-grid">
                <!-- Product cards will be dynamically inserted here -->
            </div>
        </section>

    </main>

        <footer id="footer-placeholder"></footer>

    <script type="module" src="assets/js/geral.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="assets/js/services/api.js"></script>
    <script type="module" src="assets/js/notifications.js"></script>
    <script type="module" src="assets/js/seller.js"></script>
</body>
</html>
