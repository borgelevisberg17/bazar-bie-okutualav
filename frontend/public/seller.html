<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Vendedor - Bazar Bié Okutuala</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/design-system.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="./assets/css/components/navbar.css" />
    <link rel="stylesheet" href="./assets/css/profile.css"> <!-- Reusing the profile CSS -->
</head>
<body>
    <header class="main-header" id="mainHeader"></header>

    <main class="profile-page-container">
        <section class="profile-header-section">
            <div class="profile-cover-photo">
                <img src="assets/images/placeholders/seller-cover.png" alt="Foto de Capa do Vendedor">
            </div>
            <div class="profile-details-container container">
                <div class="profile-avatar-container">
                    <img src="assets/images/placeholders/seller-avatar.png" alt="Avatar do Vendedor" class="profile-avatar">
                </div>
                <div class="profile-info">
                    <h1 class="profile-name">Nome da Loja do Vendedor</h1>
                    <p class="profile-bio">Especialistas em produtos locais e artesanato.</p>
                </div>
                <div class="profile-header-actions">
                    <button class="btn btn-primary">Seguir</button>
                    <button class="btn btn-secondary">Contactar</button>
                </div>
            </div>
            <nav class="profile-tabs-nav container">
                <a href="#products" class="tab-link active">Produtos</a>
                <a href="#about" class="tab-link">Sobre</a>
                <a href="#reviews" class="tab-link">Avaliações</a>
            </nav>
        </section>

        <div class="profile-content-container container">
            <div id="products" class="tab-content active">
                <div class="products-grid" id="seller-products-grid">
                    <!-- Seller's products will be dynamically inserted here -->
                </div>
            </div>
            <div id="about" class="tab-content">
                <!-- Seller's about information will be here -->
            </div>
            <div id="reviews" class="tab-content">
                <!-- Seller's reviews will be here -->
            </div>
        </div>
    </main>

    <footer class="main-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="assets/js/services/api.js"></script>
    <script src="assets/js/notifications.js"></script>
    <script type="module" src="assets/js/seller.js"></script>
</body>
</html>
